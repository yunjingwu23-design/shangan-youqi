# Development/test only. All published ports bind loopback; never deploy this stack.
name: syq-auth-local
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: local-only-password
    volumes:
      - syq_db:/var/lib/postgresql/data
    ports: ['127.0.0.1:54322:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30
  mail:
    image: ghcr.io/supabase/mailpit:v1.31.3
    ports: ['127.0.0.1:54324:8025']
  templates:
    image: nginx:1.28-alpine
    volumes:
      - ../supabase/templates:/usr/share/nginx/html:ro
  auth:
    image: ghcr.io/supabase/gotrue:v2.197.0
    depends_on:
      db: { condition: service_healthy }
    environment:
      NO_PROXY: db,auth,rest,templates,mail,localhost,127.0.0.1
      no_proxy: db,auth,rest,templates,mail,localhost,127.0.0.1
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54321/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:local-only-password@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_JWT_SECRET: ${LOCAL_JWT_SECRET:?generated by scripts/local.mjs}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_MAILER_OTP_LENGTH: 8
      GOTRUE_MAILER_OTP_EXP: 600
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: hello@shangan.local
      GOTRUE_SMTP_SENDER_NAME: 上岸有期
      GOTRUE_SMTP_MAX_FREQUENCY: 60s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://templates/otp.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://templates/otp.html
  rest:
    image: ghcr.io/supabase/postgrest:v16.5
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:local-only-password@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${LOCAL_JWT_SECRET}
  gateway:
    image: ghcr.io/supabase/kong:2.8.1
    depends_on: [auth, rest]
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /etc/kong/local.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_NGINX_WORKER_PROCESSES: 1
      KONG_ADMIN_LISTEN: 'off'
    volumes:
      - ./kong.yml:/etc/kong/local.yml:ro
    ports: ['127.0.0.1:54321:8000']
volumes:
  syq_db:
