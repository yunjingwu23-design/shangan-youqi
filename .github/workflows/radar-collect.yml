name: 面经雷达 · 每日采集

# 说明：GitHub Actions 的 cron 一律按 UTC 计算，北京时间 = UTC+8。
#   北京 08:30 → UTC 00:30
#   北京 20:30 → UTC 12:30
# 两个时点各跑一次，脚本自带 URL / 指纹 / 同名标题三重去重，重复跑不会重复入库。

on:
  schedule:
    - cron: '30 0 * * *'
    - cron: '30 12 * * *'
  # 支持在 Actions 页面手动点「Run workflow」试跑
  workflow_dispatch: {}

# 同一时刻只允许一个采集进程，后到的排队而不是取消前一个
concurrency:
  group: radar-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    name: 采集面经并写入 Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 检查密钥是否就位
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # 把本步骤全部输出也存一份，失败时一并回传，方便在本地直接读原因
          exec > >(tee /tmp/secret-check.log) 2>&1
          bad=0
          for n in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY DEEPSEEK_API_KEY; do
            v="${!n}"
            if [ -z "$v" ]; then
              echo "::error::缺少 $n —— 请到 Settings → Secrets and variables → Actions → Repository secrets 里添加（注意选 Repository secrets，不是 Environment secrets）"
              bad=1
            else
              echo "✓ $n 已就位（长度 ${#v}，开头 [${v:0:8}]，结尾 [...${v: -4}]）"
            fi
          done
          if [ "$bad" = "1" ]; then
            echo "密钥不全，本次不执行采集。"
            exit 1
          fi

          # 格式校验：值里带了引号、空格、换行或「KEY=」前缀，createClient 会直接抛错
          url="$NEXT_PUBLIC_SUPABASE_URL"
          if ! printf '%s' "$url" | grep -Eq '^https://[a-z0-9]+\.supabase\.co$'; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL 格式不对，长度 ${#url}（正常应为 40），开头是 [${url:0:12}]。正确形如 https://lxecahdyvrdfezgtmbfp.supabase.co，不要带引号、空格、换行，也不要带 NEXT_PUBLIC_SUPABASE_URL= 前缀"
            exit 1
          fi
          echo "✓ 数据库地址格式正确（${#url} 字符）"

          key="$SUPABASE_SERVICE_ROLE_KEY"
          case "$key" in
            sb_secret_*|eyJ*) echo "✓ 数据库密钥格式正确（${#key} 字符）" ;;
            *) echo "::error::SUPABASE_SERVICE_ROLE_KEY 不像有效密钥，长度 ${#key}，开头是 [${key:0:12}]。应以 sb_secret_ 或 eyJ 开头，不要带引号或空格"; exit 1 ;;
          esac

      - name: 环境诊断
        run: |
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"
          if [ -d node_modules/@supabase/supabase-js ]; then
            echo "✓ @supabase/supabase-js 已安装"
          else
            echo "::error::node_modules 里没有 @supabase/supabase-js，依赖没装全"
          fi
          node -e "import('@supabase/supabase-js').then(()=>console.log('✓ 模块可正常加载')).catch(e=>{console.error('::error::模块加载失败:', e.message); process.exit(1)})"

      - name: 运行采集脚本
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          AI_PROVIDER: deepseek
        run: |
          set -o pipefail
          node scripts/radar-collect.mjs --limit 12 2>&1 | tee /tmp/radar.out

      - name: 把结果写进运行摘要
        if: always()
        run: |
          {
            echo '## 本次采集结果'
            echo ''
            echo '```'
            if [ -f /tmp/radar.out ]; then
              grep -E '^(发现|✓|汇总|  牛客网|  掘金|  CSDN|  V2EX|  思否)' /tmp/radar.out | tail -40 || true
            else
              echo '脚本未产生输出（多半是前置检查未通过）'
            fi
            echo '```'
            echo ''
            if grep -q '^REPORT_JSON ' /tmp/radar.out 2>/dev/null; then
              echo '<details><summary>结构化报告</summary>'
              echo ''
              echo '```json'
              grep '^REPORT_JSON ' /tmp/radar.out | sed 's/^REPORT_JSON //'
              echo '```'
              echo ''
              echo '</details>'
            else
              echo '### 脚本最后 30 行输出'
              echo ''
              echo '```'
              tail -30 /tmp/radar.out 2>/dev/null || echo '（无输出文件）'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-log-${{ github.run_number }}
          path: logs/radar-collect.log
          if-no-files-found: ignore
          retention-days: 14

      # 失败时把完整输出推到 ci-logs 分支，方便在本地直接读取排查
      - name: 失败时把日志推回仓库
        if: failure()
        run: |
          mkdir -p ci-logs
          {
            echo "run_number: ${{ github.run_number }}"
            echo "run_id: ${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "--- 采集脚本输出 ---"
            cat /tmp/radar.out 2>/dev/null || echo "(没有产生 /tmp/radar.out)"
            echo "--- 密钥自检输出 ---"
            cat /tmp/secret-check.log 2>/dev/null || echo "(没有产生 /tmp/secret-check.log)"
            echo "--- 应用运行日志 ---"
            cat logs/radar-collect.log 2>/dev/null || echo "(没有产生 logs/radar-collect.log)"
          } > ci-logs/last-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f ci-logs/last-failure.log
          git commit -m "ci: run ${{ github.run_number }} 失败日志" || echo "无变化"
          git push -f origin ci-logs
